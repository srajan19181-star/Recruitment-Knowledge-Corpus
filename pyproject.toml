[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Keep this deliberately lean: unused imports/variables and obvious bugs,
# not full style enforcement — the goal is a CI gate that catches real
# mistakes, not one so strict it blocks on formatting nitpicks.
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by line-length above, not as an error
