name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-service:
    name: AI Service (Python / FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest pydantic pydantic-settings reportlab pypdf fastapi uvicorn redis qdrant-client prometheus-client httpx

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit and integration tests
        env:
          LLM_PROVIDER: mock
        run: pytest tests/ -v

  gateway:
    name: API Gateway (Node / Express / TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript compilation check
        run: npx tsc --noEmit

      - name: Run test suite
        run: npm test

  web:
    name: Web Frontend (Next.js / React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build verification
        run: npm run build

  docker-verification:
    name: Multi-Container Docker Build Verification
    runs-on: ubuntu-latest
    needs: [ai-service, gateway, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: false
          tags: recruiter-ai-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: false
          tags: recruiter-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: recruiter-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
