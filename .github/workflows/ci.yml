name: CI

# Runs on every push and PR — this is the quality gate: nothing merges to
# main without passing lint, tests, and a successful Docker build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Only the deps needed to lint/test the pure-logic modules —
          # not torch/sentence-transformers, which would make CI slow and
          # isn't needed for these tests (see tests/ — they cover chunking
          # and fusion, not the ML-heavy retrieval path).
          pip install ruff pytest pydantic pydantic-settings

      - name: Lint
        run: ruff check app/ tests/

      - name: Run unit tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — verifies the Dockerfile actually builds)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-pipeline-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
