# Render Infrastructure as Code Blueprint
# Deploys Managed Postgres, Redis, Private FastAPI AI Service, and Express API Gateway.
# Next.js frontend can be deployed to Vercel or as a Render Web Service.

services:
  # 1. API Gateway (Public Node.js / Express Web Service)
  - type: web
    name: recruiter-gateway
    env: node
    plan: free
    rootDir: gateway
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: recruiter-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: recruiter-redis
          property: connectionString
      - key: AI_SERVICE_URL
        value: https://recruiter-ai-service.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  # 2. AI Service (Python / FastAPI Service)
  # NOTE: Render's free tier does not offer the "pserv" (private, non-public)
  # service type at all - only "web" is available for free. Endpoints stay
  # gated by the x-internal-api-key check in app/main.py, but this is weaker
  # isolation than a true private service: anyone who finds the URL can send
  # requests, they just won't pass auth without the key. Upgrade to a paid
  # plan and switch this back to "type: pserv" for real network isolation.
  - type: web
    name: recruiter-ai-service
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: REDIS_URL
        fromService:
          type: redis
          name: recruiter-redis
          property: connectionString
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_PORT
        value: 6333
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_HTTPS
        value: true

  # 3. Managed In-Memory Redis Cache
  - type: redis
    name: recruiter-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # 4. Web Frontend (Next.js Standalone on Render - or deploy directly to Vercel)
  - type: web
    name: recruiter-web
    env: node
    plan: free
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_INTERNAL_URL
        value: https://recruiter-gateway.onrender.com

# Managed Databases
databases:
  - name: recruiter-postgres
    plan: free
    databaseName: recruiter_copilot
    user: recruiter_admin
