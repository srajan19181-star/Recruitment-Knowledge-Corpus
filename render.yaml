# Render Infrastructure as Code Blueprint
# Deploys Managed Postgres, Redis, Private FastAPI AI Service, and Express API Gateway.
# Next.js frontend can be deployed to Vercel or as a Render Web Service.

services:
  # 1. API Gateway (Public Node.js / Express Web Service)
  - type: web
    name: recruiter-gateway
    env: node
    plan: starter
    rootDir: gateway
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: recruiter-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: recruiter-redis
          property: connectionString
      - key: AI_SERVICE_URL
        value: http://recruiter-ai-service:8000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  # 2. AI Service (Private Python / FastAPI Service - Not exposed to public internet)
  - type: pserv
    name: recruiter-ai-service
    env: python
    plan: standard
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_HOST
        fromService:
          type: redis
          name: recruiter-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: recruiter-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: recruiter-redis
          property: password
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_PORT
        value: 6333
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_HTTPS
        value: true

  # 3. Managed In-Memory Redis Cache
  - type: redis
    name: recruiter-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # 4. Web Frontend (Next.js Standalone on Render - or deploy directly to Vercel)
  - type: web
    name: recruiter-web
    env: node
    plan: starter
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_INTERNAL_URL
        fromService:
          type: web
          name: recruiter-gateway
          property: url

# Managed Databases
databases:
  - name: recruiter-postgres
    plan: starter
    databaseName: recruiter_copilot
    user: recruiter_admin
